let saveOK=true;
const save=()=>{try{localStorage.setItem('aniimo',JSON.stringify(S));if(localStorage.getItem('aniimo')!==JSON.stringify(S))throw 0;saveOK=true}catch(e){saveOK=false}
 const w=$('warn');if(w)w.style.display=saveOK?'none':'block'};

const key=d=>d.n+'|'+d.form, st=d=>{const s=S[key(d)]||{got:0};if(!s.e)s.e=(s.c||s.r)?[{r:s.r||'',c:s.c||1}]:[];return s};

function render(){
 const q=$('q').value.toLowerCase(),fe=$('fe').value,fr=$('fr').value,fc=$('fc').value,fh=$('fh').value;
 const g={};
 D.forEach(d=>{const s=st(d);
  if(fe&&!d.el.includes(fe))return;if(fr&&d.role!==fr)return;if(fh&&!d.hab.includes(fh))return;
  if(fc==='y'&&!s.got)return;if(fc==='n'&&s.got)return;
  if(q&&!(d.name+' '+d.form+' '+d.hab+' '+d.el.join(' ')+' '+d.sk).toLowerCase().includes(q))return;
  (g[d.n]=g[d.n]||{name:d.name,n:d.n,f:[]}).f.push(d)});
 const keys=Object.keys(g).sort((a,b)=>a-b),filtering=q||fe||fr||fc||fh;
 $('m').innerHTML=keys.length?keys.map(k=>{const x=g[k],got=x.f.filter(d=>st(d).got).length;
  const tot=x.f.reduce((a,d)=>a+st(d).e.reduce((b,e)=>b+(e.c||0),0),0);
  return `<div class="sp ${open.has(k)||filtering?'open':''}" data-k="${k}"><div class="sh" onclick="tg('${k}')"><b>#${x.n} ${x.name}</b><small>${got}/${x.f.length} forms${tot?' · ×'+tot:''}</small></div><div class="forms">`+
  x.f.map(d=>{const s=st(d),i=D.indexOf(d);return `<div class="fm ${s.got?'got':''}"><div class="gr"><div class="L"><div class="top"><div class="pic" style="background-position:-${(i%15)*64}px -${Math.floor(i/15)*64}px"></div><div style="flex:1"><b>${d.form}</b><br>${d.el.map(e=>`<span class="tag">${e}</span>`).join('')}<span class="tag">${d.role}</span></div><button class="chk" onclick="tc(${i})">${s.got?'✓':''}</button></div><div class="d">${d.ab?'Ability: '+d.ab+'<br>':''}${d.sk?'Skills: '+d.sk+'<br>':''}${d.home?'Home: '+d.home+'<br>':''}Habitat: ${d.hab}</div></div><div class="R"><button class="add" ${s.e.length>=RAR.length-1?'disabled':''} onclick="ea(${i})">Add Collection${s.e.length?` (${s.e.length}/${RAR.length-1})`:''}</button>${s.e.map((e,j)=>`<div class="ctl"><select onchange="er(${i},${j},this.value)"><option value="">Collection ${j+1} (Rarity)</option>${RAR.slice(1).map(r=>`<option value="${r}" ${e.r===r?'selected':''} ${s.e.some((o,k)=>k!==j&&o.r===r)?'disabled':''}>${r}</option>`).join('')}</select><div class="cnt"><small class="cl">Count</small><button onclick="ec(${i},${j},-1)">−</button><span>${e.c}</span><button onclick="ec(${i},${j},1)">+</button></div><button class="del" onclick="ed(${i},${j})">✕</button></div>`).join('')}</div></div></div>`}).join('')+`</div></div>`}).join(''):'<div class="empty">No matches</div>';

 $('stat').textContent=`${all}/${D.length} forms`;$('pb').style.width=(all/D.length*100)+'%';
}
function tg(k){open.has(k)?open.delete(k):open.add(k);const e=document.querySelector(`[data-k="${k}"]`);e&&e.classList.toggle('open')}
function up(i,f){const d=D[i],s=Object.assign({got:0},st(d));f(s);delete s.c;delete s.r;S[key(d)]=s;save();render()}
const tc=i=>up(i,s=>{s.got=s.got?0:1;if(s.got&&!s.e.length)s.e.push({r:'',c:1})});
const ea=i=>up(i,s=>{if(s.e.length>=RAR.length-1)return;s.e.push({r:'',c:1});s.got=1});
const ed=(i,j)=>up(i,s=>s.e.splice(j,1));
const ec=(i,j,v)=>up(i,s=>s.e[j].c=Math.max(1,s.e[j].c+v));
